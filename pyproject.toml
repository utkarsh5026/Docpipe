[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docpipe"
version = "0.1.0"
description = "A single-file document intelligence substrate: ingest, adaptive preprocessing, pluggable OCR/VLM backends, schema-driven extraction with provenance, calibrated confidence, and an evaluation harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Utkarsh" }]
requires-python = ">=3.8"
keywords = ["ocr", "pdf", "document-extraction", "preprocessing", "vlm", "idp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]

# The core -- IR, normalisation, confidence fusion, extraction plumbing and the
# eval harness -- is pure standard library.  Everything heavier is optional and
# imported lazily, so `pip install docpipe` stays small and the library can be
# vendored as a single file.
dependencies = []

[project.optional-dependencies]
# The practical baseline: raster work, image ops, PDF, image I/O.
core = ["numpy>=1.19", "opencv-python-headless>=4.5", "pymupdf>=1.23", "pillow>=9.0"]

# OCR engines, each independent.
tesseract = ["pytesseract>=0.3.10"]
paddle = ["paddleocr>=2.7"]
rapidocr = ["rapidocr-onnxruntime>=1.3"]
easyocr = ["easyocr>=1.7"]
doctr = ["python-doctr>=0.8"]
surya = ["surya-ocr>=0.6"]

# Vision-language backends and extraction clients.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

# Schema-driven extraction (v1 and v2 are both supported).
schema = ["pydantic>=1.10"]

dev = [
    "docpipe[core,schema]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# Everything that installs cleanly without a GPU or a system package.
all = ["docpipe[core,schema,tesseract,rapidocr,anthropic,openai]"]

[project.scripts]
docpipe = "docpipe:main"

[project.urls]
Repository = "https://github.com/utkarsh5026/Docpipe"

[tool.setuptools]
py-modules = ["docpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:fitz.*",
]
