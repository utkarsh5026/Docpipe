name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  # The release workflow calls this one, so a tag cannot publish anything that
  # would not have passed on main.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor the library promises; 3.12 is the ceiling in use.
        python-version: ["3.8", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the 3.8 compatibility promise
        run: |
          python - <<'PY'
          import ast
          ast.parse(open("docpipe.py", encoding="utf-8").read(), feature_version=(3, 8))
          print("docpipe.py parses as Python 3.8")
          PY

      - name: Version is stated once, in two places that agree
        # docpipe.py carries __version__ because a vendored copy has no
        # pyproject.toml to read it from.  That duplication is the point, so the
        # drift it invites gets caught here rather than in a published wheel.
        run: |
          python - <<'PY'
          import io, re, sys

          meta = io.open("pyproject.toml", encoding="utf-8").read()
          # Deliberately not tomllib: this job also runs on 3.8, where it does
          # not exist.  The field is a plain literal, so a regex is honest here.
          declared = re.search(r'(?m)^version\s*=\s*"([^"]+)"', meta).group(1)

          source = io.open("docpipe.py", encoding="utf-8").read()
          dunder = re.search(r'(?m)^__version__\s*=\s*"([^"]+)"', source).group(1)

          if declared != dunder:
              sys.exit("version drift: pyproject says %s, docpipe.__version__ "
                       "says %s" % (declared, dunder))
          print("version %s, consistent across pyproject.toml and docpipe.py"
                % declared)
          PY

      - name: Import without any optional dependency
        # The core must stay pure-stdlib importable: a missing optional
        # dependency has to fail at the point of use, not at import time.
        run: |
          python - <<'PY'
          import subprocess, sys, textwrap
          script = textwrap.dedent("""
              import builtins
              blocked = {"numpy", "cv2", "PIL", "fitz", "pymupdf", "pydantic"}
              real = builtins.__import__
              def guard(name, *a, **k):
                  if name.split(".")[0] in blocked:
                      raise ImportError("blocked for this check: " + name)
                  return real(name, *a, **k)
              builtins.__import__ = guard
              import docpipe
              assert docpipe.parse_amount("1,23,456.78") is not None
              assert docpipe.fuse_confidence({"validation": 0.9}) > 0.5
              assert docpipe.Text.parse_amount("1,23,456.78") is not None
              assert docpipe.Confidence.fuse_confidence({"validation": 0.9}) > 0.5
              print("core imports and runs with no optional dependencies")
          """)
          sys.exit(subprocess.call([sys.executable, "-c", script]))
          PY

      - name: Every namespaced staticmethod keeps its module-level alias
        # The aliases are load-bearing: the staticmethods call one another through
        # the bare names, resolved from module globals at call time.  Losing one
        # breaks its namespace from the inside, and only at runtime.
        run: |
          python - <<'PY'
          import docpipe, sys
          names = ["Caps", "Util", "Image", "Quality", "Ingest", "Ops",
                   "Policies", "Pricing", "Text", "Confidence", "Validators"]
          bad = []
          for cls_name in names:
              cls = getattr(docpipe, cls_name)
              for attr, raw in vars(cls).items():
                  if attr.startswith("_") or not isinstance(raw, staticmethod):
                      continue
                  if getattr(docpipe, attr, None) is not getattr(cls, attr):
                      bad.append("%s.%s" % (cls_name, attr))
          if bad:
              sys.exit("missing or mismatched module-level alias: %s" % ", ".join(bad))
          total = sum(len([a for a, r in vars(getattr(docpipe, n)).items()
                           if isinstance(r, staticmethod)]) for n in names)
          print("%d staticmethods across %d namespaces, all aliased" % (total, len(names)))
          PY

      - name: Tests
        run: pytest -q

      - name: Tests with OpenCV disabled
        # Exercises the pure-NumPy image-op fallbacks end to end.
        env:
          DOCPIPE_DISABLE_OPENCV: "1"
        run: pytest -q tests/test_image_ops.py tests/test_quality.py tests/test_preprocess.py
